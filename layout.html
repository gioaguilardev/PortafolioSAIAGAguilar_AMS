<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Teoría del color SAIAG Aguilar </title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #111111;
      color: #ffffff;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .shop-container {
      max-width: 1000px;
      width: 100%;
      background-color: #010101;
      color: #ffffff
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    /* 1. Header con acciones */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 1.1rem;
      color: #ffffff;
    }

    .logo-badge {
      width: 20px;
      height: 20px;
      background-color: #ffffff;
      border-radius: 6px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links {
      display: flex;
      gap: 10px;
    }

    .nav-line {
      width: 40px;
      height: 6px;
      background-color: #cbd5e1;
      border-radius: 3px;
    }

    .user-actions {
      display: flex;
      gap: 12px;
      font-size: 18px;
    }

    /* 2. Banner / Héroe */
    .hero-banner {
      background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
      border-radius: 12px;
      padding: 40px;
      margin: 20px 0 30px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-text h1 {
      font-size: 1.8rem;
      color: #1e1b4b;
      margin-bottom: 15px;
    }

    .hero-line {
      height: 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .hero-line-1 { width: 180px; background-color: #818cf8; }
    .hero-line-2 { width: 110px; background-color: #06b6d4; }

    .hero-image {
      font-size: 70px;
    }

    /* Títulos de Secciones */
    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 15px;
    }

    /* 3. Categorías (4 Columnas) */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .category-card {
      padding: 20px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
    }

    .cat-blue { background-color: #e0f2fe; }
    .cat-green { background-color: #dcfce7; }
    .cat-orange { background-color: #ffedd5; }
    .cat-pink { background-color: #ffe4e6; }

    /* 4. Productos Destacados */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .product-card {
      background-color: #f8fafc;
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border: 1px solid #e2e8f0;
    }

    .product-image-placeholder {
      width: 100%;
      height: 90px;
      background-color: #cbd5e1;
      border-radius: 8px;
    }

    /* Responsivo */
    @media (max-width: 768px) {
      .categories-grid, .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .hero-banner {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="shop-container">
    <!-- Header -->
    <header>
      <div class="logo">
        <div class="logo-badge"></div>
        <span>SAIAG</span>
	<span>Sistema de autoaprendizaje de IA generativa</span>
      </div>
      <div class="nav-actions">
        <div class="nav-links">
          
        </div>
        <div class="user-actions">
          <span></span>
          <span></span>
          <span>👤</span>
        </div>
      </div>
    </header>

    <!-- Banner / Héroe -->
    <section class="hero-banner">
      <div class="hero-text">
        <h1>Banner / Héroe</h1>
        <div class="hero-line hero-line-1"></div>
        <div class="hero-line hero-line-2"></div>
      </div>
      <div class="hero-image">🎧</div>
    </section>

    <!-- Categorías de Productos -->
    <section>
      <h2 class="section-title">Categorías de Productos</h2>
      <div class="categories-grid">
        <div class="category-card cat-blue">💻</div>
        <div class="category-card cat-green">📱</div>
        <div class="category-card cat-orange">⌚</div>
        <div class="category-card cat-pink">👕</div>
      </div>
    </section>

    <!-- Productos Destacados -->
    <section>
      <h2 class="section-title">Productos Destacados</h2>
      <div class="products-grid">
        <div class="product-card">
          <div class="product-image-placeholder"></div>
        </div>
        <div class="product-card">
          <div class="product-image-placeholder"></div>
        </div>
        <div class="product-card">
          <div class="product-image-placeholder"></div>
        </div>
        <div class="product-card">
          <div class="product-image-placeholder"></div>
        </div>
      </div>
    </section>
  </div>

</body>
</html>
